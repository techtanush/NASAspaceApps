synthetic-mars-mobility-v1:
  name: Mars mobility practice
  body: MARS
  description: Synthetic raster terrain, candidate qualification, and rover route verification.
  allowed_modes: [synthetic]
  default_dataset_lock_id: synthetic-policy-v1
  status: AVAILABLE
  mission_preset: mission-mars-mobility.json
  rover_presets: [ares-1.json, practice-lite.json, practice-no-energy-model.json, practice-small-battery.json]
  target_source: {kind: SYNTHETIC_FIXTURE, fixture_id: practice-mars-target-v1}
  earth_source: {kind: SYNTHETIC_FIXTURE, fixture_id: practice-earth-grid-v1}
  search_region_set_id: practice-earth-grid-v1
  reference_set_id: practice-reference-set-v1
  graph_fixture_id: null
  defect_injection: true
  operator_limits: {search_max_expansions: 200000, search_max_seconds: 30, search_max_labels_per_node: 32, coarse_windows_max: 30, detailed_candidates: 6, model_requests_per_run: 40, active_run_seconds: 900, replans_total: 3}
