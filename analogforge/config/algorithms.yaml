    practice-earth-grid-v1:
      generator_id: practice-earth-grid
      version: "1.0.0"
    practice-earth-minerals-v1:
      generator_id: practice-earth-minerals
      version: "1.0.0"
    canonical-graph-v1:
      generator_id: canonical-graph
      version: "1.0.0"
