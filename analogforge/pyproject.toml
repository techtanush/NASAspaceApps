# FROZEN CONTRACT KIT FILE (architecture 35). Every branch materializes this file.
# Only the three marked "extra-<person>" lists may be edited, and only by that person.
# Tanush owns the final merged version and uv.lock (Ayan/Aradhya never commit uv.lock).

[project]
name = "analogforge"
version = "0.1.0"
description = "AnalogForge: mission-conditioned Earth analog qualification for Moon and Mars tests"
requires-python = ">=3.12,<3.14"
dependencies = [
  # platform / API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "geoalchemy2>=0.15",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  # contracts / hashing
  "jsonschema>=4.23",
  "referencing>=0.35",
  "rfc8785>=0.1.4",
  # science
  "numpy>=1.26",
  "scipy>=1.13",
  "rasterio>=1.3.10",
  "pyproj>=3.6",
  "shapely>=2.0",
  "pillow>=10.4",
  "xarray>=2024.6",
  "h5netcdf>=1.3",
  "pvl>=1.3",
  # agents (server-side only)
  "openai>=1.40",
  # passport renderer
  "jinja2>=3.1",
  "markupsafe>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
# ---- extra-tanush: Tanush may append platform-only dependencies below this line ----
extra-tanush = ["PyJWT[crypto]>=2.10", "types-jsonschema>=4.23"]
# ---- extra-ayan: Ayan may append science-only dependencies below this line ----
extra-ayan = ["h5py>=3.10"]
# ---- extra-aradhya: Aradhya may append renderer-only dependencies below this line ----
extra-aradhya = []

[project.scripts]
analogforge = "analogforge.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analogforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
  "live: requires real credentials/network; never runs in default offline suites",
  "db: requires PostgreSQL+PostGIS at TEST_DATABASE_URL",
  "slow: long-running but offline",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/analogforge/ports", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["apps/web"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "pyproj.*", "shapely.*", "scipy.*", "pvl.*", "h5netcdf.*", "xarray.*", "geoalchemy2.*", "rfc8785.*"]
ignore_missing_imports = true
