# Migration source authority is src/analogforge/db/migrations, exposed here by symlink.
# Run `uv run analogforge migrate` from analogforge/ to apply migrations through
# Store.migrate(), which supplies the explicit configured SQLAlchemy connection.
# Direct `alembic -c services/api/alembic.ini upgrade head` is intentionally unsupported:
# env.py requires an explicit connection and never reads credentials from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../../src
